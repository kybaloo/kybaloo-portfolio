# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Valeurs de repli : suffisantes tant qu'aucune page ne récupère de
    # contenu à la construction (le Studio et les pages ne font que
    # s'initialiser). Remplacer par de vraies valeurs en secrets du dépôt
    # dès qu'une étape aura besoin de lire du vrai contenu Sanity.
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID || 'ci000000' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN || 'ci-placeholder-token' }}
      SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET || 'ci-placeholder-webhook-secret' }}
      SANITY_PREVIEW_SECRET: ${{ secrets.SANITY_PREVIEW_SECRET || 'ci-placeholder-preview-secret' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Formatage
        run: npm run format:check

      - name: Archive du contenu
        run: npm run validate:archive

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Types Sanity à jour
        run: npm run typegen:check

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests de parcours
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
